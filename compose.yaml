
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printar-laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - printar-laravel-network

  nginx:
    image: nginx:alpine
    container_name: printar-laravel-nginx
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - printar-laravel-network

  db:
    image: mysql:8.4
    container_name: printar-laravel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: printar_laravel
      MYSQL_USER: printar
      MYSQL_PASSWORD: printar123
    ports:
      - "3307:3306"
    volumes:
      - mysql_laravel_data:/var/lib/mysql
    networks:
      - printar-laravel-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: printar-laravel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - printar-laravel-network

networks:
  printar-laravel-network:

volumes:
  mysql_laravel_data:

